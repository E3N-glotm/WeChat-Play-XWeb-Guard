name: Build and validate Magisk XWeb module

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Syntax
        run: |
          for f in module/*.sh module/bin/*.sh tests/*.sh; do
            bash -n "$f"
          done

      - name: Policy regression
        run: sh tests/test_policy.sh

      - name: Build and validate public release
        run: |
          chmod +x build.sh
          ./build.sh
          bash tests/test_public_release.sh dist/WeChat-Play-XWeb-Guard-v1.2.4.zip
          sha256sum dist/WeChat-Play-XWeb-Guard-v1.2.4.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WeChat-Play-XWeb-Guard
          path: dist/*.zip
      - name: Publish validated XWeb Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' module/module.prop)"
          TAG="v$VERSION"
          ZIP="dist/WeChat-Play-XWeb-Guard-v$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: cannot overwrite"
            exit 0
          fi
          HASH="$(sha256sum "$ZIP" | awk '{print $1}')"
          {
            echo "WeChat versionCode/build gating has been removed completely; versionCode is diagnostic information only."
            echo "Fixes malformed shell '+' tokens that could cause 'ERROR: could not restore +' and block static XWeb restoration."
            echo "Magisk Action probes package, CE user-data and BusyBox tar/hash capabilities without using firmware or WeChat version as a compatibility gate."
            echo "The bundled, validated XWeb core snapshot is intentionally included for authorized redistribution; private WeChat profile data must not be included."
            echo "ZIP SHA256: $HASH"
          } > RELEASE_NOTES.md
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "WeChat Play XWeb Guard $TAG" --notes-file RELEASE_NOTES.md

